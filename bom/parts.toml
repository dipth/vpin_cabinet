# Build bill of materials — source data for build/bom.html (`mise run build`).
#
# Scope: the whole cabinet build except the PC, tools, and the parts you already
# own (HDMI + DisplayPort cables, USB-A → USB-C cable).
#
# Price fields (pick one per item):
#   price       shop price incl. the vendor's `vat`; converted to Danish 25 % moms
#   price_asis  EUR used exactly as written (e.g. a quote)
#   price_dkk   DKK used exactly as written
#   (none)      not priced yet — a part still to choose
# Flags: estimate = true (rough figure).
# 3D prints are not items: they go in [[prints]] at the end of this file, with
#   no shop or price.
# purchased = true: already bought; give the price you paid as price_asis
#   (EUR) or price_dkk. The BOM page shows the row ticked as purchased.
# Priority (every item): 1 = must have to play and power up safely,
#   2 = should have for the full experience, 3 = later (lighting, lamps, toys).
#   A part that serves several phases takes the earliest one; priority_note
#   explains the split when it matters.
#
# Prices checked 2026-09-15..17. This file is the source of truth for the build.

checked = "2026-09-17"
dk_vat = 0.25
eur_dkk = 7.48   # EUR → DKK rate for the kroner columns

