name: Build and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs Python, uv, Graphviz (conda) and WireViz exactly as pinned in mise.toml.
      - uses: jdx/mise-action@v5
        with:
          install: true
          cache: true

      - name: Render the harness sheets and the BOM
        run: mise run build

      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

      - name: Upload the build (pull requests)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: wiring-plan
          path: build

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
