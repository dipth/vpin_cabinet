metadata:
  title: 05 - Toy power, BUNNY boards and 12 V toys
  description: >-
    The toy side of the cabinet. A 12 V and a 24 V Mean Well each feed their
    own fuse block, and two Arnoz BUNNY boards (16 PWM outputs each) switch
    every toy for DOF. BUNNY 1 drives the 24 V real-mech coils (sheet 09).
    BUNNY 2 drives the 12 V toys on this sheet: the four button lamps, the gear
    motor, the shaker motor and the alarm bell.
  notes: >-
    BUILD PHASE 3 (later): nothing on this sheet is needed to play. The Dude's
    Cab outputs used here can stay unconnected until then.<br/>
    CABLE LANE 2b (toy power): the left-wall floor tray, crossing to the right
    side along the underside of the front bumper-row brace. Twist each toy's
    pair. Keep toy leads out of the LED data bundle (lane 2a, right wall) and
    away from speaker cable (lane 3).<br/>
    TWO GROUND DOMAINS - KEEP THEM APART:<br/>
    (1) LED/LOGIC GND = Dude's Cab, PC (via USB) and everything powered by the
    PC (fans, sheet 07), the 5 V LED supply.<br/>
    (2) TOY GND = the 12 V and 24 V negatives (bonded by BOND_TOY), both BUNNY
    power grounds and every toy.<br/>
    Each BUNNY opto-isolates its data side (the Dude's Cab ribbon) from its
    power side. Never connect TOY GND to LED GND, a Dude's Cab GND terminal or
    the PC, or that protection is lost.<br/>
    BUNNY POWER: each board needs +12 V for its own electronics and a TOY GND
    that carries the return current of all 16 outputs (up to 40 A). Its GND
    terminal is doubled: land two 2.5 mm2 wires on it. BUNNY 1 returns 24 V coil
    current, so its GND goes to the 24 V block; BUNNY 2's goes to the 12 V
    block. BOND_TOY ties the two negative buses so both boards share one TOY
    GND.<br/>
    LOW-SIDE SWITCHING: every toy's + comes from a fuse block; its - goes to a
    BUNNY output. The BUNNY fuse on that output (5x20 mm, slow-blow, ratings
    on the board labels) protects the toy and the MOSFET; the blade fuse at the
    block protects the wire.<br/>
    MOTORS AND BELLS: fit an Arnoz La Nettoyeuse (1000 uF + flywheel diode)
    right at the gear motor, the shaker motor and the alarm bell, toy on the
    diode side. It is rated 25 V, so 12 V toys only.<br/>
    SHAKER STRENGTH: the shaker motor runs from a step-down converter set to
    about 7 V (James' setting), so even an output stuck at 100 % (software or
    USB fault) can't drive it at full 12 V. DOF still varies the intensity
    through the BUNNY's PWM, under the output's Max Value. Also give the
    shaker output a Security Delay in the configurator. The converter's IN-
    and OUT- are joined on the board, so OUT- stays unused: the motor's -
    goes to the BUNNY output, as for every toy. Set the voltage with the
    motor disconnected; cheap modules can have stiff trim pots.<br/>
    GEAR MOTOR: upper right, where ~80 % of tables that use the gear toy
    put it (James' survey of ~272 tables). Use the standard VW gear motor
    (191955113A family) that the Pinscape guide recommends.<br/>
    CONFIGURATOR: add BUNNY 1 (DIP address 1) and BUNNY 2 (address 2) as
    extensions. Lamp outputs use the "Leds" preset (PWM, so DOF can blink and
    fade them).<br/>
    PERSPEX LIGHTS: the add-on's 3D-printed mounts hold a 12 V COB strip inside
    the Perspex cover over the boards. The coin door interlock switch powers it
    only while the door is open (NC contacts close when the door opens). Its
    second pole can feed The BRAIN's DOOR input (sheet 02).<br/>
    REMOVABLE BACKBOX: the alarm bell and the knocker (sheet 09) connect
    through one 4-pin pluggable block on the backbox floor, X_BB_TOYS. No
    beacons: the backbox top stays clean.

connectors:
  PSU_12V:
    <<: [*mean_well_psu, *psu_dc_3x3]
    type: Mean Well RSP-320-12 (12 V 26.7 A, PFC)
    subtype: "12 V toys and BUNNY logic. Rear-left wall, low"
    notes: Adjust V.ADJ to 12.0 V at the fuse block.
  PSU_24V:
    <<: [*mean_well_psu, *psu_dc_3x3]
    type: Mean Well RSP-500-24 (24 V 21 A, PFC)
    subtype: "24 V real-mech coils. Left wall, low, in front of the 12 V supply"
    notes: Adjust V.ADJ to 24.0 V at the fuse block.

  FB_12V:
    <<: *fuse_block_12
    subtype: "12 V TOY rail, above the 12 V PSU. F1/F2: 2 A BUNNY logic, F3: 2 A lamps, F4: 7.5 A gear motor, F5: 10 A shaker (via 7 V step-down), F6: 7.5 A backbox toys, F7: 2 A Perspex lights, F8-F12 spare"
    additional_components:
      - type: ATO blade fuse 2 A (+ 2 spare)
        qty: 6
      - type: ATO blade fuse 7.5 A
        qty: 2
      - type: ATO blade fuse 10 A
        qty: 1
  FB_24V:
    <<: *fuse_block_6
    subtype: "24 V COIL rail, above the 24 V PSU. Circuits on sheet 09"

  SDC:
    <<: *super_dudes_cab
    subtype: toy expansion port
    pinlabels: [BUNNY (JST-PH 6)]

  BUNNY_1: &bunny
    type: Arnoz BUNNY
    subtype: "16 PWM outputs, 8 A each, 40 A total, opto-isolated. DIP address 1: 24 V coils (sheet 09)"
    manufacturer: L'Atelier d'Arnoz
    supplier: shop.arnoz.com
    bgcolor: "#fbe0f2"
    pinlabels: [DATA IN (JST 6), DATA OUT (JST 6), +12V, GND, GND 2]
    notes: On the real-mech board shelf, left of the Dude's Cab.
  BUNNY_2:
    <<: *bunny
    subtype: "16 PWM outputs. DIP address 2: 12 V toys and lamps"
    pinlabels: [DATA IN (JST 6), DATA OUT (JST 6), +12V, GND, GND 2,
                OUT 1 - Start lamp (1 A), OUT 2 - Launch Ball lamp (1 A),
                OUT 3 - Return lamp (1 A), OUT 4 - Exit lamp (1 A),
                OUT 5 - Gear motor (5 A SB), OUT 6 - Shaker motor (5 A SB),
                OUT 7 - Alarm bell (2 A SB), OUT 8-16 spare]
    notes: On the real-mech board shelf, right of the Dude's Cab.

  LAMP_START: &lamp
    type: Start button lamp, 12 V LED built into the arcade button
    bgcolor: "#eeeeee"
    pinlabels: [+, "-"]
  LAMP_LAUNCH:
    <<: *lamp
    type: Launch Ball button lamp, 12 V W5W LED
  LAMP_RETURN:
    <<: *lamp
    type: Return button lamp, 12 V LED built into the arcade button
  LAMP_EXIT:
    <<: *lamp
    type: Exit button lamp, 12 V LED built into the arcade button

  GEAR_MOTOR: &toy12
    type: 12 V VW gear motor (191955113A family) on a 3D-printed mount
    subtype: upper right - right wall, in front of the 5 V supply
    bgcolor: "#eeeeee"
    pinlabels: [+, "-"]
  SHAKER_MOTOR:
    <<: *toy12
    type: Stern-style 12 V shaker motor
    subtype: cabinet floor, middle-right
  ALARM_BELL:
    <<: *toy12
    type: 12 V alarm bell, 4 in
    subtype: backbox

  BUCK_SHAKER:
    type: DC-DC step-down converter, 8 A (XL4016 / XH-M404 class), set to ~7 V
    subtype: next to the shaker motor
    bgcolor: "#fff1c2"
    pinlabels: [IN +, IN -, OUT +, OUT - (unused)]

  NETT_GEAR: &nett
    type: Arnoz La Nettoyeuse (1000 uF + flywheel diode, 25 V max)
    subtype: at the gear motor
    manufacturer: L'Atelier d'Arnoz
    bgcolor: "#fbe0f2"
    pinlabels: [IN +, IN -, TOY +, TOY -]
  NETT_SHAKER:
    <<: *nett
    subtype: at the shaker motor
  NETT_BELL:
    <<: *nett
    subtype: at the alarm bell

  INTERLOCK:
    type: Coin door interlock switch, DPDT (E79-30A)
    subtype: "pressed = door shut. Pole 1 used here; pole 2 → The BRAIN DOOR (optional)"
    bgcolor: "#eeeeee"
    pinlabels: [COM 1, NC 1, NO 1, COM 2, NC 2, NO 2]
  PERSPEX_LIGHTS:
    type: 12 V COB LED strip, cool white, cut to fit the two Perspex mounts
    subtype: under the real-mech Perspex cover (left + right)
    bgcolor: "#eeeeee"
    pinlabels: [+, "-"]

  X_BB_TOYS:
    type: Pluggable screw terminal block, 4-pin, 5.08 mm (plug + socket)
    subtype: "BACKBOX DISCONNECT - toys. Socket half on the cabinet side"
    bgcolor: "#fff1c2"
    pinlabels: [+24V, KNOCKER -, +12V, ALARM BELL -]
    notes: The knocker's two pins are wired on sheet 09.

  SPL_LAMP_12V:
    <<: *wago_splice
    type: WAGO 221-415 (+12 V lamps)

cables:
  FEED_12V:
    <<: *psu_feed_2_5mm2
  FEED_24V:
    <<: *psu_feed_2_5mm2
  BOND_TOY:
    <<: *gnd_bond_2_5mm2
    type: TOY GND bond, 12 V negative bus ↔ 24 V negative bus
    length: 0.5

  R_BUNNY_1:
    category: bundle
    type: JST-PH 6-pin ribbon (Arnoz, 0.5 m)
    wirecount: 1
    colors: [GY]
    length: 0.5
  R_BUNNY_2:
    category: bundle
    type: JST-PH 6-pin ribbon (Arnoz, 0.5 m)
    wirecount: 1
    colors: [GY]
    length: 0.5

  PW_LOGIC_1: &logic
    <<: *gnd_link
    type: +12 V BUNNY logic supply
    gauge: 0.5 mm2
    colors: [YE]
    length: 1.6
  PW_LOGIC_2:
    <<: *logic
    length: 1.9
  G_BUNNY_1:
    <<: *pwr_pair_2_5
    type: BUNNY 1 TOY GND, 2 x 2.5 mm2 in parallel (24 V coil return)
    colors: [BK, BK]
    wirelabels: [GND, GND 2]
    length: 1.7
  G_BUNNY_2:
    <<: *pwr_pair_2_5
    type: BUNNY 2 TOY GND, 2 x 2.5 mm2 in parallel (12 V toy return)
    colors: [BK, BK]
    wirelabels: [GND, GND 2]
    length: 1.9

  PW_LAMPS:
    <<: *gnd_link
    type: 12 V lamp supply
    gauge: 0.5 mm2
    colors: [YE]
    length: 1.7
  L_START_LAMP: &lamp_lead
    type: 2-core lamp lead
    gauge: 0.34 mm2
    show_equiv: true
    wirecount: 2
    colors: [YE, WH]
    wirelabels: [+12V, switched -]
    length: 0.6
  L_LAUNCH_LAMP:
    <<: *lamp_lead
    length: 0.6
  L_RETURN_LAMP:
    <<: *lamp_lead
    length: 0.6
  L_EXIT_LAMP:
    <<: *lamp_lead
    length: 0.6

  T_GEAR: &toy_return
    <<: *gnd_link
    type: Toy return (switched -), BUNNY output → toy
    gauge: 1 mm2
    colors: [WH]
    length: 3
  PW_GEAR: &toy_feed
    <<: *gnd_link
    type: +12 V toy feed
    gauge: 1 mm2
    colors: [YE]
    length: 2
  T_SHAKER:
    <<: *toy_return
    gauge: 1.5 mm2
    length: 1
  PW_SHAKER:
    <<: *toy_feed
    gauge: 1.5 mm2
    length: 1.3
  G_SHAKER_BUCK:
    <<: *gnd_link
    type: Step-down converter ground, to the 12 V negative bus
    gauge: 1.5 mm2
    length: 1.3
  PW_SHAKER_7V:
    <<: *toy_feed
    type: +7 V converter → shaker motor
    gauge: 1.5 mm2
    length: 0.2
  PW_BB_TOYS:
    <<: *toy_feed
    type: +12 V backbox toy feed (alarm bell)
    length: 1.3
  T_BB_TOYS:
    type: Alarm bell return, from BUNNY 2
    gauge: 1 mm2
    show_equiv: true
    wirecount: 1
    colors: [WH]
    wirelabels: [ALARM BELL -]
    length: 2.9
  T_BELL_BOX: &bb_lead
    type: 2-core toy lead, twisted (backbox side)
    gauge: 1 mm2
    show_equiv: true
    wirecount: 2
    colors: [YE, WH]
    wirelabels: [+12V, switched -]
    length: 0.5

  PW_PERSPEX:
    <<: *toy_feed
    gauge: 0.5 mm2
    type: +12 V Perspex lights (via the interlock)
    length: 1.7
  L_PERSPEX:
    <<: *gnd_link
    gauge: 0.5 mm2
    type: +12 V interlock → Perspex strips (left, then across to the right)
    colors: [YE]
    length: 1.3
  G_PERSPEX:
    <<: *gnd_link
    gauge: 0.5 mm2
    type: Perspex lights GND return to the 12 V block
    length: 1.6

connections:
  # --- PSUs → fuse blocks, and the TOY GND bond -------------------------------------------------
  - - PSU_12V: [+V 1, +V 2, +V 3, -V 1, -V 2, -V 3]
    - FEED_12V: [1-6]
    - FB_12V: [BAT+, BAT+, BAT+, NEG IN, NEG IN, NEG IN]
  - - PSU_24V: [+V 1, +V 2, +V 3, -V 1, -V 2, -V 3]
    - FEED_24V: [1-6]
    - FB_24V: [BAT+, BAT+, BAT+, NEG IN, NEG IN, NEG IN]
  - - FB_12V: [NEG12]
    - BOND_TOY: [1]
    - FB_24V: [NEG6]

  # --- BUNNY boards ----------------------------------------------------------------------------
  - - SDC: [BUNNY (JST-PH 6)]
    - R_BUNNY_1: [1]
    - BUNNY_1: [DATA IN (JST 6)]
  - - BUNNY_1: [DATA OUT (JST 6)]
    - R_BUNNY_2: [1]
    - BUNNY_2: [DATA IN (JST 6)]
  - - FB_12V: [F1]
    - PW_LOGIC_1: [1]
    - BUNNY_1: [+12V]
  - - FB_12V: [F2]
    - PW_LOGIC_2: [1]
    - BUNNY_2: [+12V]
  - - FB_24V: [NEG1, NEG2]
    - G_BUNNY_1: [1-2]
    - BUNNY_1: [GND, GND 2]
  - - FB_12V: [NEG1, NEG2]
    - G_BUNNY_2: [1-2]
    - BUNNY_2: [GND, GND 2]

  # --- Button lamps: common +12 V, each lamp switched on its own output ----------------------
  - - FB_12V: [F3]
    - PW_LAMPS: [1]
    - SPL_LAMP_12V
  - - SPL_LAMP_12V
    - L_START_LAMP: [1]
    - LAMP_START: [+]
  - - BUNNY_2: [OUT 1 - Start lamp (1 A)]
    - L_START_LAMP: [2]
    - LAMP_START: ["-"]
  - - SPL_LAMP_12V
    - L_LAUNCH_LAMP: [1]
    - LAMP_LAUNCH: [+]
  - - BUNNY_2: [OUT 2 - Launch Ball lamp (1 A)]
    - L_LAUNCH_LAMP: [2]
    - LAMP_LAUNCH: ["-"]
  - - SPL_LAMP_12V
    - L_RETURN_LAMP: [1]
    - LAMP_RETURN: [+]
  - - BUNNY_2: [OUT 3 - Return lamp (1 A)]
    - L_RETURN_LAMP: [2]
    - LAMP_RETURN: ["-"]
  - - SPL_LAMP_12V
    - L_EXIT_LAMP: [1]
    - LAMP_EXIT: [+]
  - - BUNNY_2: [OUT 4 - Exit lamp (1 A)]
    - L_EXIT_LAMP: [2]
    - LAMP_EXIT: ["-"]

  # --- Gear motor and shaker motor, each through a La Nettoyeuse ------------------------------
  - - FB_12V: [F4]
    - PW_GEAR: [1]
    - NETT_GEAR: [IN +]
  - - BUNNY_2: [OUT 5 - Gear motor (5 A SB)]
    - T_GEAR: [1]
    - NETT_GEAR: [IN -]
  - - NETT_GEAR: [TOY +, TOY -]
    - ==>
    - GEAR_MOTOR: [+, "-"]
  - - FB_12V: [F5]
    - PW_SHAKER: [1]
    - BUCK_SHAKER: [IN +]
  - - FB_12V: [NEG5]
    - G_SHAKER_BUCK: [1]
    - BUCK_SHAKER: [IN -]
  - - BUCK_SHAKER: [OUT +]
    - PW_SHAKER_7V: [1]
    - NETT_SHAKER: [IN +]
  - - BUNNY_2: [OUT 6 - Shaker motor (5 A SB)]
    - T_SHAKER: [1]
    - NETT_SHAKER: [IN -]
  - - NETT_SHAKER: [TOY +, TOY -]
    - ==>
    - SHAKER_MOTOR: [+, "-"]

  # --- Backbox toys, through the backbox disconnect --------------------------------------------
  - - FB_12V: [F6]
    - PW_BB_TOYS: [1]
    - X_BB_TOYS: [+12V]
  - - BUNNY_2: [OUT 7 - Alarm bell (2 A SB)]
    - T_BB_TOYS: [1]
    - X_BB_TOYS: [ALARM BELL -]
  - - X_BB_TOYS: [+12V]
    - T_BELL_BOX: [1]
    - NETT_BELL: [IN +]
  - - X_BB_TOYS: [ALARM BELL -]
    - T_BELL_BOX: [2]
    - NETT_BELL: [IN -]
  - - NETT_BELL: [TOY +, TOY -]
    - ==>
    - ALARM_BELL: [+, "-"]

  # --- Perspex lights, only while the coin door is open --------------------------------------
  - - FB_12V: [F7]
    - PW_PERSPEX: [1]
    - INTERLOCK: [COM 1]
  - - INTERLOCK: [NC 1]
    - L_PERSPEX: [1]
    - PERSPEX_LIGHTS: [+]
  - - FB_12V: [NEG7]
    - G_PERSPEX: [1]
    - PERSPEX_LIGHTS: ["-"]
